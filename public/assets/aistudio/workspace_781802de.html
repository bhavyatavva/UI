<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BaselTrack regulatory reporting workspace">
    <title>BaselTrack | Workspace</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/workspace.css">
    <link rel="stylesheet" href="modules/user-access/manage-roles/manage-roles.css">
    <link rel="stylesheet" href="modules/user-access/manage-users/manage-users.css">
    <link rel="stylesheet" href="modules/user-access/shared/manage-users-roles-refinements.css">
    <link rel="stylesheet" href="css/modules/report-templates.css">
    <link rel="stylesheet" href="css/modules/report-templates-controls.css">
    <link rel="stylesheet" href="css/modules/reporting-calendar.css">
    <link rel="stylesheet" href="css/modules/reporting-calendar-module.css">
    <link rel="stylesheet" href="css/modules/generate-report.css">
    <link rel="stylesheet" href="css/modules/manage-reports.css">
    <link rel="stylesheet" href="css/modules/raise-query.css">
    <link rel="stylesheet" href="css/modules/manage-query.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Core (order matters) -->
    <script src="js/roles.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/module-bundle.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/workspace.js"></script>

    <!-- Shared helpers + modules that are rendered from <template> elements below.
         Every other module (modules/**) is loaded on demand by js/navigation.js. -->
    <script defer src="modules/user-access/shared/table-pagination.js"></script>
    <script defer src="js/modules/generate-report.js"></script>
    <script defer src="js/modules/raise-query.js"></script>
    <script defer src="js/modules/manage-query.js"></script>
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="topbar-left">
                <button class="icon-button menu-toggle" id="sidebarToggle" aria-label="Show or hide navigation"
                    aria-expanded="true" data-tip="Show / hide menu" data-tip-pos="start">
                    <span class="hamburger"><i></i><i></i><i></i></span>
                </button>
                <a class="brand" href="#dashboard" aria-label="BaselTrack home">
                    <img src="images/logo.png" alt="BaselTrack logo" onerror="this.style.display='none'">
                    <span>BaselTrack</span>
                </a>
            </div>
            <div class="topbar-right">
                <span class="role-chip" id="currentRole"></span>

                <div class="popup-anchor">
                    <button class="icon-button notification-trigger" id="notificationToggle"
                        aria-label="Notifications" aria-expanded="false" aria-haspopup="true" data-tip="Notifications">
                        <svg class="bell-icon" viewBox="0 0 24 24" width="21" height="21" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z" />
                            <path d="M10 20a2.2 2.2 0 0 0 4 0" />
                        </svg>
                        <span class="notification-badge" id="notificationBadge" hidden>0</span>
                    </button>
                    <section class="popup notification-panel" id="notificationPanel" aria-label="Notifications" hidden>
                        <div class="notif-head">
                            <strong>Notifications</strong>
                            <span class="notif-new" id="notificationNew"></span>
                        </div>
                        <div id="notificationList" class="notif-list"></div>
                        <div class="notif-empty" id="emptyNotifications" hidden>
                            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
                                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z" />
                                <path d="M10 20a2.2 2.2 0 0 0 4 0" />
                            </svg>
                            <strong>You're all caught up</strong>
                            <span>No new notifications.</span>
                        </div>
                    </section>
                </div>

                <div class="popup-anchor">
                    <button class="profile-trigger" id="profileToggle" aria-expanded="false" aria-haspopup="true"
                        data-tip="My account" data-tip-pos="end">
                        <span class="avatar tb"></span>
                        <span class="profile-label"><strong id="pName"></strong><small id="pRole"></small></span>
                        <span class="chevron">⌄</span>
                    </button>
                    <section class="popup profile-panel" id="profilePanel" hidden>
                        <div class="profile-summary">
                            <span class="avatar large tb"></span>
                            <div><strong id="pName2"></strong><small id="pSub"></small></div>
                        </div>
                        <button class="popup-action" data-profile-action="profile">Manage Profile <span>›</span></button>
                        <button class="popup-action" data-profile-action="password">Change Password <span>›</span></button>
                        <button class="popup-action logout-action" id="logoutButton">Sign out <span>↗</span></button>
                    </section>
                </div>
            </div>
        </header>

        <div class="workspace-body">
            <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
            <aside class="sidebar" id="sidebar" aria-label="Main navigation">
                <div class="sidebar-heading"><span>WORKSPACE</span><button class="icon-button sidebar-close"
                        id="sidebarClose" aria-label="Close navigation" data-tip="Close menu">×</button></div>
                <nav class="sidebar-nav" id="sidebarNav"></nav>
                <div class="sidebar-footer"><span class="online-indicator"></span><span id="sbRole"></span></div>
            </aside>

            <main class="main-content" id="mainContent">
                <div id="dashboardView"><p class="module-loading" style="padding:30px">Loading dashboard...</p></div>
                <div id="moduleView" hidden>
                </div>
                <template id="manageRolesTemplate">
                    <section class="mr-module" id="manageRolesApp"></section>
                </template>

                <template id="manageUsersTemplate">
                    <section class="mu-module" id="manageUsersApp"></section>
                </template>

                <template id="moduleManagementTemplate">

                    <section class="mm-module" id="manageModulesApp">

                        <!-- Breadcrumb -->
                        <div class="mm-breadcrumb">
                            <span>Configuration Management</span>
                            <i class="fa-solid fa-chevron-right"></i>
                            <strong>Module Management</strong>
                        </div>

                        <!-- Page Header -->
                        <div class="mm-page-header">
                            <div>
                                <h2>Manage Modules</h2>
                                <p>View and manage the availability of BaselTrack modules.</p>
                            </div>
                        </div>

                        <!-- Main Card -->
                        <div class="mm-card">

                            <!-- Filter Header -->
                            <div class="mm-toolbar">

                                <div class="mm-filter-tabs">
                                    <button class="mm-tab active" data-status="All">
                                        All
                                    </button>

                                    <button class="mm-tab" data-status="Active">
                                        Active
                                    </button>

                                    <button class="mm-tab" data-status="Inactive">
                                        Inactive
                                    </button>
                                </div>

                                <button class="mm-filter-toggle" id="mmFilterToggle">
                                    <i class="fa-solid fa-filter"></i>
                                    Filters
                                    <i class="fa-solid fa-chevron-down"></i>
                                </button>

                            </div>

                            <!-- Filter Panel -->
                            <div class="mm-filter-panel" id="mmFilterPanel" hidden>

                                <div class="mm-filter-grid">

                                    <div class="mm-form-group">
                                        <label for="mmSearch">Search</label>
                                        <input type="text" id="mmSearch" placeholder="Search module code or name">
                                    </div>

                                    <div class="mm-form-group">
                                        <label for="mmStatusFilter">Status</label>

                                        <select id="mmStatusFilter">
                                            <option value="All">All Statuses</option>
                                            <option value="Active">Active</option>
                                            <option value="Inactive">Inactive</option>
                                        </select>
                                    </div>

                                </div>

                                <div class="mm-filter-actions">
                                    <button class="mm-btn mm-btn-reset" id="mmReset">
                                        Reset
                                    </button>

                                    <button class="mm-btn mm-btn-primary" id="mmApply">
                                        Apply
                                    </button>
                                </div>

                            </div>

                            <!-- Table Information -->
                            <div class="mm-table-info">
                                <span>
                                    Showing <strong id="mmResultCount">0</strong> modules
                                </span>
                            </div>

                            <!-- Table -->
                            <div class="mm-table-wrapper">

                                <table class="mm-table">

                                    <thead>
                                        <tr>

                                            <th>
                                                <button class="mm-sort" data-sort="code">
                                                    Module Code
                                                    <span class="mm-sort-icon">↕</span>
                                                </button>
                                            </th>

                                            <th>
                                                <button class="mm-sort" data-sort="name">
                                                    Module Name
                                                    <span class="mm-sort-icon">↕</span>
                                                </button>
                                            </th>

                                            <th>
                                                <button class="mm-sort" data-sort="status">
                                                    Status
                                                    <span class="mm-sort-icon">↕</span>
                                                </button>
                                            </th>

                                            <th>Actions</th>

                                        </tr>
                                    </thead>

                                    <tbody id="mmTableBody">
                                        <!-- JavaScript renders rows here -->
                                    </tbody>

                                </table>

                                <!-- Empty State -->
                                <div class="mm-empty-state" id="mmEmptyState" hidden>
                                    <i class="fa-solid fa-folder-open"></i>
                                    <h3>No modules found</h3>
                                    <p>Try changing your search or filter criteria.</p>
                                </div>

                            </div>

                        </div>

                        <!-- View Module Modal -->
                        <div class="mm-modal-overlay" id="mmViewModal" hidden>

                            <div class="mm-modal">

                                <div class="mm-modal-header">
                                    <div>
                                        <h3>Module Details</h3>
                                        <p>View module information</p>
                                    </div>

                                    <button class="mm-modal-close" data-close="view">
                                        &times;
                                    </button>
                                </div>

                                <div class="mm-modal-body">

                                    <div class="mm-detail-group">
                                        <label>Module Name</label>
                                        <div id="mmViewName">-</div>
                                    </div>

                                    <div class="mm-detail-group">
                                        <label>Module Code</label>
                                        <div id="mmViewCode">-</div>
                                    </div>

                                    <div class="mm-detail-group">
                                        <label>Status</label>
                                        <div id="mmViewStatus">-</div>
                                    </div>

                                </div>

                                <div class="mm-modal-footer">
                                    <button class="mm-btn mm-btn-primary" data-close="view">
                                        Close
                                    </button>
                                </div>

                            </div>

                        </div>

                        <!-- Edit Module Modal -->
                        <div class="mm-modal-overlay" id="mmEditModal" hidden>

                            <div class="mm-modal">

                                <div class="mm-modal-header">
                                    <div>
                                        <h3>Edit Module</h3>
                                        <p>Update module availability</p>
                                    </div>

                                    <button class="mm-modal-close" data-close="edit">
                                        &times;
                                    </button>
                                </div>

                                <div class="mm-modal-body">

                                    <input type="hidden" id="mmEditId">

                                    <div class="mm-detail-group">
                                        <label>Module Name</label>
                                        <div id="mmEditName">-</div>
                                    </div>

                                    <div class="mm-detail-group">
                                        <label>Module Code</label>
                                        <div id="mmEditCode">-</div>
                                    </div>

                                    <div class="mm-detail-group">
                                        <label>Module Status</label>

                                        <div class="mm-status-toggle">

                                            <span id="mmEditStatusLabel">Active</span>

                                            <label class="mm-switch">
                                                <input type="checkbox" id="mmEditStatus">
                                                <span class="mm-switch-slider"></span>
                                            </label>

                                        </div>

                                    </div>

                                    <p class="mm-edit-note">
                                        You can only change the module status.
                                    </p>

                                </div>

                                <div class="mm-modal-footer">

                                    <button class="mm-btn mm-btn-reset" data-close="edit">
                                        Cancel
                                    </button>

                                    <button class="mm-btn mm-btn-primary" id="mmSaveChanges">
                                        Save Changes
                                    </button>

                                </div>

                            </div>

                        </div>

                        <!-- Toast -->
                        <div class="mm-toast" id="mmToast"></div>

                    </section>

                </template>

                <template id="reportTemplatesTemplate">
                    <section class="rt-module" id="reportTemplatesApp">
                        <section class="page-card">
                            <div class="page-head">
                                <div>
                                    <h1>Report Templates</h1>
                                    <p>Maintain BaselTrack regulatory report definitions and editable template content.
                                    </p>
                                </div>
                            </div>
                            <div class="catalog-toolbar">
                                <div class="tabs"><button class="tab active" data-status="all">All (<span
                                            id="allCount">0</span>)</button><button class="tab"
                                        data-status="Active">Active (<span id="activeCount">0</span>)</button><button
                                        class="tab" data-status="Inactive">Inactive (<span
                                            id="inactiveCount">0</span>)</button></div><input class="template-search"
                                    id="templateSearch" type="search" aria-label="Search report code or name"
                                    placeholder="Search report code or name">
                            </div>
                            <div class="table-shell">
                                <table>
                                    <thead>
                                        <tr>
                                            <th class="sortable" data-key="code">Report Code <span>▲▼</span></th>
                                            <th class="sortable" data-key="name">Report Name <span>▲▼</span></th>
                                            <th class="sortable" data-key="status">Status <span>▲▼</span></th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="reportBody"></tbody>
                                </table>
                                <div id="emptyState" class="empty">No report templates match your search.</div>
                            </div>
                        </section>
                        <div class="modal-overlay" id="viewModal">
                            <section class="modal view-card">
                                <div class="view-head">
                                    <div class="report-mark">R</div>
                                    <div><span>REGULATORY REPORT TEMPLATE</span>
                                        <h2 id="viewName"></h2>
                                        <p id="viewCode"></p>
                                    </div><button id="closeView">✕</button>
                                </div>
                                <div class="view-meta">
                                    <div><span>Status</span><strong id="viewStatus"></strong></div>
                                    <div><span>Template Version</span><strong id="viewVersion"></strong></div>
                                </div>
                                <div class="template-preview">
                                    <div class="preview-head"><span>Template Preview</span><small>Read only</small>
                                    </div>
                                    <div id="viewTemplate" class="preview-body"></div>
                                </div>
                                <div class="modal-actions"><button class="secondary" id="closeViewBottom">Close</button>
                                </div>
                            </section>
                        </div>
                        <div class="modal-overlay" id="editModal">
                            <section class="modal edit-card">
                                <div class="panel-head">
                                    <div>
                                        <h2>Edit Report Template</h2>
                                        <p>Report code is locked. Update metadata, status and template content.</p>
                                    </div><button id="closeEdit">✕</button>
                                </div>
                                <div class="form-grid"><label>Report Code<input id="editCode"
                                            disabled></label><label>Report Name<input id="editName"></label><label
                                        class="full">Status<div class="switch-row"><button id="editStatus"
                                                class="switch" role="switch"><i></i></button><b id="editStatusText"></b>
                                        </div></label></div>
                                <div class="editor-block">
                                    <div class="editor-head">
                                        <div>
                                            <h3>Report Template</h3>
                                            <p>Use structured text or HTML-like content for regulatory submissions.</p>
                                        </div>
                                        <div class="editor-tools"><button type="button"
                                                data-wrap="<strong>|</strong>"><b>B</b></button><button type="button"
                                                data-wrap="<em>|</em>"><i>I</i></button><button type="button"
                                                data-prefix="• ">• List</button></div>
                                    </div><textarea id="editTemplate" rows="13"></textarea>
                                    <div class="editor-foot"><span id="charCount">0 characters</span><span>Changes are
                                            saved in this workspace.</span></div>
                                </div>
                                <div class="modal-actions"><button class="secondary"
                                        id="cancelEdit">Cancel</button><button class="primary"
                                        id="updateTemplate">Update</button></div>
                            </section>
                        </div>
                    </section>
                </template>

                <template id="reportingCalendarTemplate">
                    <section class="rc-module" id="reportingCalendarApp">
                        <div class="content-card">
                            <div class="page-header">
                                <div>
                                    <h1 class="page-title">Reporting Calendar</h1>
                                    <p class="page-subtitle">Monitor regulatory obligations, reporting deadlines and
                                        submission progress</p>
                                </div>
                                <div class="page-actions">
                                    <div class="view-toggle"><button class="active"
                                            data-view="month">Month</button><button data-view="list">List</button></div>
                                    <button class="filter-btn" id="openFilterBtn">Filter</button>
                                </div>
                            </div>
                            <section class="kpi-grid">
                                <article><span>Upcoming</span><strong id="upcomingCount">0</strong><small>Future
                                        obligations</small></article>
                                <article><span>Due This Week</span><strong id="weekCount">0</strong><small>Immediate
                                        workload</small></article>
                                <article><span>Submitted</span><strong id="submittedCount">0</strong><small>Completed
                                        filings</small></article>
                                <article class="danger"><span>Overdue</span><strong
                                        id="overdueCount">0</strong><small>Needs attention</small></article>
                            </section>
                            <section class="month-view" id="monthView">
                                <div class="calendar-card">
                                    <div class="calendar-toolbar">
                                        <div class="calendar-nav"><button id="prevMonth">‹</button><button id="todayBtn"
                                                class="today-btn">Today</button><button id="nextMonth">›</button></div>
                                        <h2 id="monthTitle"></h2>
                                        <div class="legend"><span class="draft">Draft</span><span class="review">In
                                                Review</span><span class="approved">Approved</span><span
                                                class="submitted">Submitted</span><span class="overdue">Overdue</span>
                                        </div>
                                    </div>
                                    <div class="weekdays">
                                        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                                    </div>
                                    <div class="calendar-grid" id="calendarGrid"></div>
                                </div>
                            </section>
                            <section class="list-view hidden" id="listView">
                                <div class="schedule-head">
                                    <div>
                                        <h2>Regulatory Obligations</h2>
                                        <p id="listSummary">All reporting obligations</p>
                                    </div>
                                </div>
                                <div class="table-wrapper">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Report ID</th>
                                                <th>Report Name</th>
                                                <th>Regulator</th>
                                                <th>Reporting Period</th>
                                                <th>Due Date</th>
                                                <th>Deadline</th>
                                                <th>Owner</th>
                                                <th>Status</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody id="reportTableBody"></tbody>
                                    </table>
                                </div>
                            </section>
                        </div>
                        <div class="overlay" id="filterOverlay">
                            <section class="filter-panel">
                                <div class="panel-head">
                                    <div>
                                        <h2>Filter Reports</h2>
                                        <p>Filters apply to both Month and List views.</p>
                                    </div><button id="closeFilterBtn">✕</button>
                                </div><label>Search<input id="searchFilter"
                                        placeholder="Report ID or report name"></label><label>Regulator<select
                                        id="regulatorFilter">
                                        <option value="">All Regulators</option>
                                        <option>RBI</option>
                                        <option>EBA</option>
                                        <option>PRA</option>
                                        <option>ECB</option>
                                    </select></label><label>Owner<select id="ownerFilter">
                                        <option value="">All Owners</option>
                                        <option>Risk</option>
                                        <option>Finance</option>
                                        <option>Treasury</option>
                                        <option>Compliance</option>
                                    </select></label><label>Reporting Period<select id="periodFilter">
                                        <option value="">All Periods</option>
                                    </select></label><label>Status<select id="statusFilter">
                                        <option value="">All Status</option>
                                        <option>Draft</option>
                                        <option>In Review</option>
                                        <option>Approved</option>
                                        <option>Submitted</option>
                                        <option>Overdue</option>
                                    </select></label>
                                <div class="date-row"><label>From<input type="date"
                                            id="fromDate"></label><label>To<input type="date" id="toDate"></label></div>
                                <div class="panel-actions"><button class="secondary"
                                        id="resetFilters">Reset</button><button class="primary"
                                        id="applyFilters">Apply</button></div>
                            </section>
                        </div>
                        <div class="modal-overlay" id="dayModal">
                            <section class="modal day-modal">
                                <div class="modal-head">
                                    <div><span class="eyebrow">DEADLINE DETAILS</span>
                                        <h2 id="dayModalTitle"></h2>
                                    </div><button id="closeDayModal">✕</button>
                                </div>
                                <p class="modal-subtitle" id="dayModalSummary"></p>
                                <div class="day-events" id="dayEvents"></div>
                                <div class="modal-actions"><button class="secondary" id="closeDayBottom">Close</button>
                                </div>
                            </section>
                        </div>
                        <div class="modal-overlay" id="reportModal">
                            <section class="modal report-summary">
                                <div class="report-head">
                                    <div class="report-mark">R</div>
                                    <div><span class="eyebrow">REGULATORY REPORT</span>
                                        <h2 id="reportName"></h2>
                                        <p id="reportId"></p>
                                    </div><button id="closeReportModal">✕</button>
                                </div>
                                <div class="report-meta">
                                    <div><span>Regulator</span><strong id="reportRegulator"></strong></div>
                                    <div><span>Reporting Period</span><strong id="reportPeriod"></strong></div>
                                    <div><span>Frequency</span><strong id="reportFrequency"></strong></div>
                                    <div><span>Responsible Team</span><strong id="reportOwner"></strong></div>
                                    <div><span>Reviewer</span><strong id="reportReviewer"></strong></div>
                                    <div><span>Due Date</span><strong id="reportDue"></strong></div>
                                    <div><span>Status</span><strong id="reportStatus"></strong></div>
                                    <div><span>Deadline</span><strong id="reportDeadline"></strong></div>
                                </div>
                                <div class="workflow">
                                    <h3>Submission Progress</h3>
                                    <div id="workflowSteps"></div>
                                </div>
                                <div class="modal-actions"><button class="secondary"
                                        id="closeReportBottom">Close</button></div>
                            </section>
                        </div>
                        <div class="notification-overlay" id="notificationOverlay">
                            <div class="notification-popup">
                                <div class="panel-head">
                                    <h2>Deadline Alerts</h2><button id="closeNotification">✕</button>
                                </div>
                                <div id="notificationList"></div>
                            </div>
                        </div>
                    </section>
                </template>

                <template id="auditTrailTemplate">
                    <section class="at-module" id="auditTrailApp">

                        <div class="at-page-header">
                            <div>
                                <div class="at-breadcrumb">Configuration Management <span>/</span> Audit Trail</div>
                                <h2>Audit Trail</h2>
                                <p>Monitor and review activities performed across the BaselTrack application.</p>
                            </div>
                        </div>

                        <!-- Summary -->
                        <div class="at-summary-card">
                            <div class="at-summary-icon">▤</div>
                            <div>
                                <div class="at-summary-label">Total Logs</div>
                                <div class="at-summary-value" id="atTotalLogs">5</div>
                                <div class="at-summary-description">Total records matching the current filters</div>
                            </div>
                        </div>

                        <!-- Toolbar -->
                        <div class="at-toolbar">
                            <div class="at-toolbar-left">
                                <h3>Audit Logs</h3>
                                <span class="at-record-count" id="atRecordCount">5 records</span>
                            </div>

                                            <th>Progress</th>
                                        </tr>
                                    </thead>

                                    <tbody id="mqAssignedRows">
                                        <tr>
                                            <td colspan="9" class="mq-empty">
                                                No assigned queries available.
                                            </td>
                                        </tr>
                                    </tbody>

                                </table>

                            </div>

                        </section>


                        <!-- CLOSED QUERIES -->

                        <section class="mq-panel">

                            <div class="mq-panel-heading">
                                <div>
                                    <h3>Closed Queries</h3>
                                    <p>
                                        Review queries that have been marked as resolved.
                                    </p>
                                </div>

                                <span class="mq-section-count">
                                    Completed
                                </span>
                            </div>

                            <div class="mq-table-wrap">

                                <table class="mq-table">

                                    <thead>
                                        <tr>
                                            <th>Query ID</th>
                                            <th>Report Name</th>
                                            <th>Raised By</th>
                                            <th>Priority</th>
                                            <th>Assigned To</th>
                                            <th>Date</th>
                                            <th>Description</th>
                                            <th>Status</th>
                                            <th>Progress</th>
                                        </tr>
                                    </thead>

                                    <tbody id="mqClosedRows">
                                        <tr>
                                            <td colspan="9" class="mq-empty">
                                                No closed queries available.
                                            </td>
                                        </tr>
                                    </tbody>

                                </table>

                            </div>

                        </section>


                        <!-- TOAST -->

                        <div class="mq-toast" id="mqToast" role="status"></div>

                    </section>

                </template>

            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
        <section class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-heading">
                <div><span class="eyebrow">BASELTRACK ACCOUNT</span>
                    <h2 id="modalTitle">Manage Profile</h2>
                </div><button class="icon-button" id="modalClose" aria-label="Close dialog" data-tip="Close" data-tip-pos="end">×</button>
            </div>
            <div id="modalBody"></div>
        </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <button class="back-to-top" id="backToTop" aria-label="Back to top" data-tip="Back to top">↑</button>
</body>

</html>
